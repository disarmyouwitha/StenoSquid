# Lab experiment, not a shipping change: shrink the system heap. Append after memory.conf in EXTRA_CONF_FILE.
#
# docs/engineering-notes-2026-11-25.md section 7.3: nothing allocates from the system heap (no k_malloc call sites
# in the image); the engine's malloc uses the libc arena, which is all SRAM above the static image. The 32 KB that
# corne_left.conf reserves therefore only shrinks the engine's heap. 1 KiB keeps the _system_heap symbol (the memory
# report references it) while giving the rest back to the libc arena.
#
# Unproven on hardware: boot, USB, Bluetooth and Studio must all be exercised with this fragment before any decision.
CONFIG_HEAP_MEM_POOL_SIZE=1024
