# Extras for the diagnostic left build (NiceNano-Left-Diagnostic): serial diagnostics, battery logging and Phase-0 measurements.
# Pair with logging.overlay and the zmk-usb-logging snippet; see
# tools/battery/README.md.
CONFIG_ZMK_JAVELIN_SERIAL_CONSOLE=y
CONFIG_ZMK_JAVELIN_BATTERY_LOG=y

CONFIG_ZMK_JAVELIN_DICTIONARY_BENCHMARK=y

# Leave RAM for Native storage while retaining the serial diagnostic console.
CONFIG_LOG_BUFFER_SIZE=1024
