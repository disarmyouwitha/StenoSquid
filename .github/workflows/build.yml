name: Build firmware

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  dictionaries:
    name: Prepare pinned dictionaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare and verify every image
        run: python3 tools/dictionaries/prepare.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dictionary-images
          path: |
            build/lapwing/
            build/plover/
            build/extras/

  host-tests:
    name: host tests
    needs: dictionaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dictionary-images
          path: build
      - name: Fetch native test dependencies at pinned revisions
        run: |
          python3 tools/ci/fetch_pinned.py javelin-steno javelin-steno
          python3 tools/ci/fetch_pinned.py zmk zmk
          python3 tools/ci/fetch_pinned.py zephyr zephyr
          python3 tools/ci/fetch_pinned.py lvgl lvgl zephyr/west.yml
      - name: Check Python and generated keymaps
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 -m ruff check
          python3 tools/render_keymap.py --check
      - name: Run every native regression and display renderer
        run: python3 tools/tests/run_all.py
      - name: Sanitize candidate-B native storage core
        env:
          CXX: clang++ -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
        run: |
          python3 tools/tests/test_native_checkpoint_job.py
          python3 tools/tests/test_native_live_journal.py
          python3 tools/tests/test_native_journal.py
          python3 tools/tests/test_native_catalog.py
          python3 tools/tests/test_native_transaction.py
          python3 tools/tests/test_native_checkpoint.py
          python3 tools/tests/test_native_dictionary_adapter.py
          python3 tools/tests/test_storage_probe.py
          python3 tools/tests/test_checkpoint_probe.py

  build:
    needs: dictionaries
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm@sha256:edb1c953438c6f720ddb79c3762f3972013b7fbbaf4fff3592fc869983e7afc5
    strategy:
      fail-fast: false
      matrix:
        include:
          # Steno Squid left with a Corne Ultralight right, on nice!nano v2.
          - name: NiceNano-Left-Diagnostic
            shield: corne_left
            snippet: zmk-usb-logging
            dictionaries: true
            diagnostics: true
          - name: NiceNano-Left-Default
            shield: corne_left
            snippet: studio-rpc-usb-uart
            dictionaries: true
          - name: NiceNano-Left-No-Display
            shield: corne_left
            snippet: studio-rpc-usb-uart
            dictionaries: true
            extra: "-DEXTRA_CONF_FILE=$repo/config/nicenano-wireless-corne/left-no-display.conf"
          - name: NiceNano-Right-No-Display
            shield: corne_right
          - name: NiceNano-Right-Default
            shield: corne_right nice_view_adapter nice_view
            nice_view: true
          # Boardsource Wireless Corne SMT with the Steno Squid flash board.
          - name: Boardsource-Left-Diagnostic
            boardsource: left
            snippet: zmk-usb-logging
            dictionaries: true
            diagnostics: true
          - name: Boardsource-Left-Default
            boardsource: left
            snippet: studio-rpc-usb-uart
            dictionaries: true
          - name: Boardsource-Right-Default
            boardsource: right
          - name: Boardsource-Left-No-Display
            boardsource: left
            snippet: studio-rpc-usb-uart
            dictionaries: true
            no_display: true
          - name: Boardsource-Right-No-Display
            boardsource: right
            no_display: true
          # Left-side flash probes for first power-up. They read the flash
          # chip and write nothing. Run them before the left firmware.
          - name: Boardsource-Probe
            boardsource: probe
          - name: Boardsource-Quad-Probe
            boardsource: probe
            quad: true
    steps:
      - name: Check out this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: repo

      - name: Restore pinned west dependencies
        id: west-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ws/.west
            ws/zmk
            ws/zephyr
            ws/modules
            ws/javelin-steno
            ws/zmk-hid-io-plover-hid
          key: west-${{ runner.os }}-${{ hashFiles('repo/config/west.yml') }}

      # This repository has its own zephyr/ folder, so the west workspace
      # lives beside it and only borrows the pinned manifest.
      - name: Fetch the pinned ZMK, Zephyr and modules
        run: |
          git config --global --add safe.directory "*"
          mkdir -p ws/config
          cp repo/config/west.yml ws/config/west.yml
          cd ws
          if [ ! -d .west ]; then west init -l config; fi
          west update --fetch-opt=--filter=tree:0
          west zephyr-export

      - name: Cache pinned west dependencies
        if: matrix.name == 'NiceNano-Left-Default' && steps.west-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ws/.west
            ws/zmk
            ws/zephyr
            ws/modules
            ws/javelin-steno
            ws/zmk-hid-io-plover-hid
          key: west-${{ runner.os }}-${{ hashFiles('repo/config/west.yml') }}

      - name: Fetch the pinned Boardsource board definition
        if: matrix.boardsource
        run: |
          git init vendor
          git -C vendor fetch --depth 1 https://github.com/boardsource/wireless-corne_zmk_config 2158104902e164c317e35f53dfa0ca1e36e1a751
          git -C vendor checkout --detach FETCH_HEAD
      - name: Download verified dictionary images
        if: matrix.dictionaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dictionary-images
          path: repo/build

      - name: Build
        working-directory: ws
        shell: bash
        run: |
          repo="$GITHUB_WORKSPACE/repo"
          split="$repo/config/nicenano-wireless-corne"
          source=zmk/app
          args=("-DZMK_EXTRA_MODULES=$repo")
          case "${{ matrix.boardsource }}" in
            left)
              board=blecorne_left
              conf="$split/corne.conf;$split/corne_left.conf"
              if [ "${{ matrix.no_display }}" = "true" ]; then
                conf="$conf;$split/left-no-display.conf"
              fi
              if [ "${{ matrix.diagnostics }}" = "true" ]; then
                conf="$conf;$split/logging.conf"
                args+=("-DEXTRA_DTC_OVERLAY_FILE=$repo/config/boardsource-wireless-corne/logging.overlay")
              fi
              args+=("-DBOARD_ROOT=$GITHUB_WORKSPACE/vendor"
                     "-DZMK_CONFIG=$repo/config/boardsource-wireless-corne"
                     "-DEXTRA_CONF_FILE=$conf")
              ;;
            right)
              board=blecorne_right
              args+=("-DBOARD_ROOT=$GITHUB_WORKSPACE/vendor"
                     "-DZMK_CONFIG=$repo/config/boardsource-wireless-corne")
              if [ "${{ matrix.no_display }}" = "true" ]; then
                args+=("-DEXTRA_CONF_FILE=$split/corne.conf")
              else
                args+=("-DSHIELD=nice_view"
                       "-DEXTRA_CONF_FILE=$split/corne.conf;$split/right-nice-view.conf")
              fi
              ;;
            probe)
              board=blecorne_left
              source="$repo/tools/qspi"
              args=("-DBOARD_ROOT=$GITHUB_WORKSPACE/vendor"
                    "-DDTS_ROOT=$GITHUB_WORKSPACE/ws/zmk/app"
                    "-DDTC_OVERLAY_FILE=$source/boardsource.overlay"
                    "-DKCONFIG_ROOT=$source/Kconfig.boardsource"
                    "-DEXTRA_CONF_FILE=$source/boardsource.conf")
              if [ "${{ matrix.quad }}" = "true" ]; then
                args+=("-DQUAD_PROBE=ON")
              fi
              ;;
            *)
              board=nice_nano//zmk
              args+=("-DSHIELD=${{ matrix.shield }}" "-DZMK_CONFIG=$split")
              if [ "${{ matrix.nice_view }}" = "true" ]; then
                args+=("-DEXTRA_CONF_FILE=$split/right-nice-view.conf"
                       "-DEXTRA_DTC_OVERLAY_FILE=$split/right-nice-view.overlay")
              fi
              if [ "${{ matrix.diagnostics }}" = "true" ]; then
                args+=("-DEXTRA_CONF_FILE=$split/logging.conf"
                       "-DEXTRA_DTC_OVERLAY_FILE=$split/logging.overlay")
              fi
              if [ -n "${{ matrix.extra }}" ]; then
                args+=(${{ matrix.extra }})
              fi
              ;;
          esac
          if [ "${{ matrix.dictionaries }}" = "true" ]; then
            args+=("-DZMK_JAVELIN_LAPWING_IMAGE=$repo/build/lapwing/lapwing-base.bin"
                   "-DZMK_JAVELIN_PLOVER_IMAGE=$repo/build/plover/plover-main.bin"
                   "-DZMK_JAVELIN_EXTRAS_IMAGE=$repo/build/extras/lapwing-extras.bin")
          fi
          snippet=()
          if [ -n "${{ matrix.snippet }}" ]; then
            snippet=(-S "${{ matrix.snippet }}")
          fi
          set -o pipefail
          west build -s "$source" -d "$GITHUB_WORKSPACE/out" -b "$board" "${snippet[@]}" -- "${args[@]}" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # The linker prints how full the internal flash and RAM are. Post it on
      # the run page so growth is visible on every push.
      - name: Summarize flash and RAM use
        shell: bash
        run: |
          {
            echo "### ${{ matrix.name }}: flash and RAM"
            echo '```'
            grep -A 8 "Memory region" "$GITHUB_WORKSPACE/build.log" | grep -E "Memory region|FLASH:|RAM:" || echo "No memory table in the build log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Memory by owner
        if: success()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.name }}: memory by owner"
            python3 repo/tools/ci/memory_by_owner.py "$(ls out/zephyr/*.elf | head -1)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Job logs need a GitHub sign-in to read. Annotations do not, so surface
      # the compiler's errors as annotations when the build fails.
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E "error|undefined reference|fatal|FAILED" "$GITHUB_WORKSPACE/build.log"             | head -12 | cut -c1-600 | sed 's/%/%25/g'             | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Upload firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: out/zephyr/${{ matrix.boardsource == 'probe' && 'zephyr' || 'zmk' }}.uf2
          if-no-files-found: error


  release:
    name: Publish firmware release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: firmware-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download everyday firmware
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*-*-Default"
          path: artifacts

      - name: Download firmware without display
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*-*-No-Display"
          path: artifacts

      - name: Name the firmware files for each board and half
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          for board in NiceNano Boardsource; do
            for half in Left Right; do
              for variant in Default No-Display; do
                name="$board-$half-$variant"
                test -s "artifacts/$name/zmk.uf2"
                cp "artifacts/$name/zmk.uf2" "release/$name.uf2"
              done
            done
          done

      - name: Publish tested firmware
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            if [ "$draft" != true ]; then
              echo "::error::This release is already published. Use a new version tag."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/*.uf2 --clobber
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=true
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease"
