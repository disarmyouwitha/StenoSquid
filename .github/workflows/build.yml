name: Build firmware

on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

jobs:
  upload-tests:
    name: upload.py tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
      - name: Run the upload.py tests against a fake keyboard
        run: |
          python3 tools/steno-squid-lapwing/test_upload.py
          python3 tools/tests/test_base_provision.py

  stroke-feed-tests:
    name: stroke tape tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
      - name: Build and run the stroke tape tests as C and as C++
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -O2 -o stroke-feed-c tools/tests/test_stroke_feed.c
          ./stroke-feed-c
          g++ -std=c++17 -x c++ -Wall -Wextra -Werror -O2 -o stroke-feed-cpp tools/tests/test_stroke_feed.c
          ./stroke-feed-cpp

  # Everything that runs natively: the art, dictionary compiler, Practice logic,
  # HID transport and personal-dictionary snapshot reader. The pinned Javelin
  # engine and ZMK are fetched alone (no west) for the tests that extract
  # functions from them.
  host-tests:
    name: host tests
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
      - name: Squid art, tiny dictionary and personal dictionary snapshot
        run: |
          python3 tools/tests/test_sprite_bits.py
          python3 tools/dict_compiler/test_tiny_dict.py
          python3 tools/steno-squid-lapwing/test_import_personal.py
      - name: Practice logic and HID transport
        run: |
          python3 tools/tests/test_practice_progress.py
          python3 tools/tests/test_practice_lookup.py
          python3 tools/tests/test_javelin_hid_transport.py
      - name: Fetch the pinned Javelin engine and ZMK
        run: |
          python3 tools/ci/fetch_pinned.py javelin-steno javelin-steno
          python3 tools/ci/fetch_pinned.py zmk zmk
      - name: Practice input, layer entry and repeat translation against the pinned sources
        run: |
          python3 tools/tests/test_practice_menu.py javelin-steno
          python3 tools/tests/test_practice_entry.py zmk/app
          python3 tools/tests/run_repeat_translation.py javelin-steno
      - name: Compile the dictionaries
        run: |
          mkdir -p build/lapwing
          python3 -c "import sys, urllib.request; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])" https://raw.githubusercontent.com/aerickt/plover-lapwing-aio/4ac5d53cf039a2b1f4c484456663c85e7df4e859/plover_lapwing/dictionaries/lapwing-base.json build/lapwing/lapwing-base.json
          python3 tools/dict_compiler/compile_dict.py build/lapwing/lapwing-base.json --base-addr 0x12000000 -o build/lapwing/lapwing-base.bin
          python3 tools/steno-squid-lapwing/prepare_plover.py
          python3 tools/steno-squid-lapwing/prepare_extras.py
      - name: Practice words and hint index against the compiled dictionaries
        run: |
          python3 tools/tests/test_practice_words.py
          python3 tools/tests/test_hint_index.py

  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        include:
          # Steno Squid left with a Corne Ultralight right, on nice!nano v2.
          - name: NiceNano-Left-Diagnostic
            shield: corne_left
            snippet: zmk-usb-logging
            dictionaries: true
            diagnostics: true
          - name: NiceNano-Left-Default
            shield: corne_left
            snippet: studio-rpc-usb-uart
            dictionaries: true
          - name: NiceNano-Left-No-Display
            shield: corne_left
            snippet: studio-rpc-usb-uart
            dictionaries: true
            extra: "-DEXTRA_CONF_FILE=$repo/config/steno-squid-split/left-no-display.conf"
          - name: NiceNano-Right-No-Display
            shield: corne_right
          - name: NiceNano-Right-Default
            shield: corne_right nice_view_adapter nice_view
            nice_view: true
          # Boardsource Wireless Corne SMT with the Steno Squid flash board.
          - name: Boardsource-Left-Diagnostic
            boardsource: left
            snippet: zmk-usb-logging
            dictionaries: true
            diagnostics: true
          - name: Boardsource-Left-Default
            boardsource: left
            snippet: studio-rpc-usb-uart
            dictionaries: true
          - name: Boardsource-Right-Default
            boardsource: right
          - name: Boardsource-Left-No-Display
            boardsource: left
            snippet: studio-rpc-usb-uart
            dictionaries: true
            no_display: true
          - name: Boardsource-Right-No-Display
            boardsource: right
            no_display: true
          # Left-side flash probes for first power-up. They read the flash
          # chip and write nothing. Run them before the left firmware.
          - name: Boardsource-Probe
            boardsource: probe
          - name: Boardsource-Quad-Probe
            boardsource: probe
            quad: true
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: repo

      # This repository has its own zephyr/ folder, so the west workspace
      # lives beside it and only borrows the pinned manifest.
      - name: Fetch the pinned ZMK, Zephyr and modules
        run: |
          git config --global --add safe.directory "*"
          mkdir -p ws/config
          cp repo/config/west.yml ws/config/west.yml
          cd ws
          west init -l config
          west update --fetch-opt=--filter=tree:0
          west zephyr-export

      - name: Fetch the pinned Boardsource board definition
        if: matrix.boardsource
        run: |
          git clone https://github.com/boardsource/wireless-corne_zmk_config vendor
          git -C vendor checkout --detach 2158104902e164c317e35f53dfa0ca1e36e1a751
      # Renders the real display widgets with the pinned LVGL on the build host.
      - name: Display preview test
        if: matrix.nice_view
        working-directory: repo
        shell: bash
        run: |
          # LVGL's CMake build enables C++, which this image lacks by default.
          if ! command -v g++ > /dev/null; then
            (apt-get update -qq && apt-get install -y -qq g++) > /dev/null 2>&1 || true
          fi
          for tool in cmake ninja gcc g++; do
            if ! command -v "$tool" > /dev/null; then
              echo "::warning::$tool not found in the build image; skipping the display preview test"
              exit 0
            fi
          done
          python3 tools/tests/run_display_preview.py "$GITHUB_WORKSPACE/ws/modules/lib/gui/lvgl"

      - name: Compile the base dictionaries
        if: matrix.dictionaries
        working-directory: repo
        env:
          PYTHONUTF8: "1"
        run: |
          mkdir -p build/lapwing
          python3 -c "import sys, urllib.request; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])" https://raw.githubusercontent.com/aerickt/plover-lapwing-aio/4ac5d53cf039a2b1f4c484456663c85e7df4e859/plover_lapwing/dictionaries/lapwing-base.json build/lapwing/lapwing-base.json
          python3 tools/dict_compiler/compile_dict.py build/lapwing/lapwing-base.json --base-addr 0x12000000 -o build/lapwing/lapwing-base.bin
          python3 tools/steno-squid-lapwing/prepare_plover.py
          python3 tools/steno-squid-lapwing/prepare_extras.py

      - name: Build
        working-directory: ws
        shell: bash
        run: |
          repo="$GITHUB_WORKSPACE/repo"
          split="$repo/config/steno-squid-split"
          source=zmk/app
          args=("-DZMK_EXTRA_MODULES=$repo")
          case "${{ matrix.boardsource }}" in
            left)
              board=blecorne_left
              conf="$split/corne.conf;$split/corne_left.conf"
              if [ "${{ matrix.no_display }}" = "true" ]; then
                conf="$conf;$split/left-no-display.conf"
              fi
              if [ "${{ matrix.diagnostics }}" = "true" ]; then
                conf="$conf;$split/logging.conf"
                args+=("-DEXTRA_DTC_OVERLAY_FILE=$repo/config/boardsource-wireless-corne/logging.overlay")
              fi
              args+=("-DBOARD_ROOT=$GITHUB_WORKSPACE/vendor"
                     "-DZMK_CONFIG=$repo/config/boardsource-wireless-corne"
                     "-DEXTRA_CONF_FILE=$conf")
              ;;
            right)
              board=blecorne_right
              args+=("-DBOARD_ROOT=$GITHUB_WORKSPACE/vendor"
                     "-DZMK_CONFIG=$repo/config/boardsource-wireless-corne")
              if [ "${{ matrix.no_display }}" = "true" ]; then
                args+=("-DEXTRA_CONF_FILE=$split/corne.conf")
              else
                args+=("-DSHIELD=nice_view"
                       "-DEXTRA_CONF_FILE=$split/corne.conf;$split/right-nice-view.conf")
              fi
              ;;
            probe)
              board=blecorne_left
              source="$repo/tools/steno-squid-qspi"
              args=("-DBOARD_ROOT=$GITHUB_WORKSPACE/vendor"
                    "-DDTS_ROOT=$GITHUB_WORKSPACE/ws/zmk/app"
                    "-DDTC_OVERLAY_FILE=$source/boardsource.overlay"
                    "-DKCONFIG_ROOT=$source/Kconfig.boardsource"
                    "-DEXTRA_CONF_FILE=$source/boardsource.conf")
              if [ "${{ matrix.quad }}" = "true" ]; then
                args+=("-DQUAD_PROBE=ON")
              fi
              ;;
            *)
              board=nice_nano//zmk
              args+=("-DSHIELD=${{ matrix.shield }}" "-DZMK_CONFIG=$split")
              if [ "${{ matrix.nice_view }}" = "true" ]; then
                args+=("-DEXTRA_CONF_FILE=$split/right-nice-view.conf"
                       "-DEXTRA_DTC_OVERLAY_FILE=$split/right-nice-view.overlay")
              fi
              if [ "${{ matrix.diagnostics }}" = "true" ]; then
                args+=("-DEXTRA_CONF_FILE=$split/logging.conf"
                       "-DEXTRA_DTC_OVERLAY_FILE=$split/logging.overlay")
              fi
              if [ -n "${{ matrix.extra }}" ]; then
                args+=(${{ matrix.extra }})
              fi
              ;;
          esac
          if [ "${{ matrix.dictionaries }}" = "true" ]; then
            args+=("-DZMK_JAVELIN_LAPWING_IMAGE=$repo/build/lapwing/lapwing-base.bin"
                   "-DZMK_JAVELIN_PLOVER_IMAGE=$repo/build/plover/plover-main.bin"
                   "-DZMK_JAVELIN_EXTRAS_IMAGE=$repo/build/extras/lapwing-extras.bin")
          fi
          snippet=()
          if [ -n "${{ matrix.snippet }}" ]; then
            snippet=(-S "${{ matrix.snippet }}")
          fi
          set -o pipefail
          west build -s "$source" -d "$GITHUB_WORKSPACE/out" -b "$board" "${snippet[@]}" -- "${args[@]}" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # The linker prints how full the internal flash and RAM are. Post it on
      # the run page so growth is visible on every push.
      - name: Summarize flash and RAM use
        shell: bash
        run: |
          {
            echo "### ${{ matrix.name }}: flash and RAM"
            echo '```'
            grep -A 8 "Memory region" "$GITHUB_WORKSPACE/build.log" | grep -E "Memory region|FLASH:|RAM:" || echo "No memory table in the build log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Memory by owner
        if: success()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.name }}: memory by owner"
            python3 repo/tools/ci/memory_by_owner.py "$(ls out/zephyr/*.elf | head -1)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Job logs need a GitHub sign-in to read. Annotations do not, so surface
      # the compiler's errors as annotations when the build fails.
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E "error|undefined reference|fatal|FAILED" "$GITHUB_WORKSPACE/build.log"             | head -12 | cut -c1-600 | sed 's/%/%25/g'             | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/zephyr/${{ matrix.boardsource == 'probe' && 'zephyr' || 'zmk' }}.uf2
          if-no-files-found: error
